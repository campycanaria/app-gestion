<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b121a"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Campy Canaria"><title>Campy Canaria</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon-192.png"><link rel="apple-touch-icon" href="./apple-touch-icon.png"><style>
:root{color-scheme:dark;font:16px/1.5 system-ui,Arial,sans-serif}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0%,#1b423d,#0b121a 65%);color:#e5fff8;min-height:100dvh;display:grid;place-items:center;padding:16px}main{max-width:420px;width:100%;background:#152b36;border:1px solid #37665e;border-radius:20px;padding:28px;box-shadow:0 16px 60px #0005;text-align:center}img{width:84px;height:84px;border-radius:18px}h1{font-size:24px;margin:12px 0 8px}p{color:#aec7c6;font-size:14px}label{display:block;font-size:13px;text-align:left;margin:25px 0 5px}input{width:100%;background:#0b1b27;color:white;border:1px solid #547779;padding:12px;border-radius:10px;font:16px system-ui;overflow:hidden}button{display:block;width:100%;margin-top:13px;padding:12px;font-weight:800;font-size:16px;background:#83eacb;color:#08291c;border:none;border-radius:11px;cursor:pointer}.secondary{background:#294959;color:#e4fff7;font-size:13px}small{color:#abc7c4;display:block;margin-top:12px}#launch{display:none}#status{margin-top:14px}#edit{display:none}</style></head>
<body><main><img src="./icon-192.png" alt="Campy Canaria"><h1>Campy Canaria</h1><p>Acceso a la aplicación privada de gestión</p><form id="form"><label for="url">URL de la aplicación de Apps Script (termina en /exec)</label><input id="url" type="url" inputmode="url" placeholder="https://script.google.com/macros/s/.../exec" autocomplete="off" required><button type="submit">Guardar URL y abrir la aplicación</button><small>La URL solo se guarda en este móvil, no se envía a GitHub ni a terceros.</small></form><div id="launch"><button id="open" type="button">Abrir Campy Canaria</button><button id="edit" class="secondary" type="button">Cambiar URL</button></div><p id="status" role="status" aria-live="polite"></p></main><script>
'use strict';
const KEY='campy.private.execUrl.v1';
const form=document.getElementById('form'),launch=document.getElementById('launch'),edit=document.getElementById('edit'),status=document.getElementById('status'),url=document.getElementById('url');
function valid(s){try{let u=new URL(s);return u.protocol==='https:'&&u.hostname==='script.google.com'&&/^\/macros\/s\/[^/]+\/exec\/?$/.test(u.pathname)}catch(e){return false}}
function show(){const saved=localStorage.getItem(KEY)||'';if(valid(saved)){form.style.display='none';launch.style.display='block';edit.style.display='block'}else{form.style.display='block';launch.style.display='none';url.value=saved}}
function go(s){status.textContent='Abriendo la aplicación privada…';location.assign(s)}
form.addEventListener('submit',e=>{e.preventDefault();const s=url.value.trim();if(!valid(s)){status.textContent='Introduce la URL publicada /exec, no el enlace del editor.';return;}localStorage.setItem(KEY,s);show();go(s)});
document.getElementById('open').addEventListener('click',()=>{const s=localStorage.getItem(KEY)||'';if(valid(s))go(s);else show()});
edit.addEventListener('click',()=>{form.style.display='block';launch.style.display='none';url.value=localStorage.getItem(KEY)||'';url.focus()});
show();
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
